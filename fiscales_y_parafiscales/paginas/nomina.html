<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Liquidación de Nómina</title>
  <link rel="stylesheet" href="../css/liquidacion.css">
</head>

<style>
  body {
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    background: linear-gradient(
      135deg,
      #050505,
      #111111,
      #1a1a1a,
      #2a0000
    );
        margin:0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        min-height: 100vh;
    }

    .card{

        background: #2c2c2c;
        border-radius: 16px;
        padding: 30px 40px;
        animation: brilloContenedor 3s infinite ease-in-out;
        width:100%;
        max-width: 450px;
        margin: 30px 0;
        gap:20px;
    }
@keyframes brilloContenedor {
    0% {
        box-shadow: 0 0 10px #a20000;
    }
    50% {
        box-shadow: 0 0 25px #a20000, 0 0 40px #a20000;
    }
    100% {
        box-shadow: 0 0 10px #a20000;
    }
}
    h2{
        margin-bottom: 20px;
        color: #ffffff;
        text-align: center;
        font-weight: normal;
        text-shadow: 2px 2px 10px white
    }

    label{
        display:block;
        margin: 12px 0 6px;
        color: #ffffff;           
    }


    input{
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 1rem;
    }

    button {

    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: linear-gradient(
      135deg,
      #5c0000,
      #a20000,
      #ff2b2b
    );
    color: #fff;
    border:none;
    border-radius: 20px;
    font-size: 1rem;
    cursor: pointer;
      transition: transform 0.3s ease;

    }

    button:hover{
        background-color: #fff;
        color: #ffffff;
        transform: scale(1.1);
    }

    #resultado {
        margin-top: 20px;
        font-size: 1rem;
        color: #fff;
        white-space: pre-line;
    }
</style>
<body>
  <div class="card">
    <h2>Liquidador de Nómina</h2>

    <label>Salario mensual (COP)</label>
    <input type="number" id="salario" placeholder="Ej: 1200000">

    <label>Días laborados</label>
    <input type="number" id="dias" placeholder="Ej: 30">

    <label>Horas extras diurnas</label>
    <input type="number" id="hed" value="0" min="0">

    <label>Horas extras nocturnas</label>
    <input type="number" id="hen" value="0" min="0">
    
        <label>Horas extras nocturnas festivas</label>
    <input type="number" id="henf" value="0" min="0">

            <label>Horas extras diurnas festivas</label>
    <input type="number" id="hedf" value="0" min="0">

    <button onclick="liquidar()">Calcular liquidación</button>

    <div id="resultado"></div>
  </div>

  <script>
    const SMMLV = 1423500;
    const SUB_TRANSPORTE = 200000;
function liquidar() 
{
  const salario = parseFloat(document.getElementById('salario').value) || 0;
  const dias = parseFloat(document.getElementById('dias').value) || 0;
  const hed = parseFloat(document.getElementById('hed').value) || 0;
  const hen = parseFloat(document.getElementById('hen').value) || 0;
    const henf = parseFloat(document.getElementById('henf').value) || 0;
    const hedf = parseFloat(document.getElementById('hedf').value) || 0;


  if (salario <= 0 || dias <= 0) {
    document.getElementById('resultado').textContent = "Ingrese salario y días válidos.";
    return;
  }

  const valorDia = salario / 30;
  const salarioBasico = valorDia * dias;


  const subsidio = (salario <= 2 * SMMLV) ? SUB_TRANSPORTE * (dias / 30) : 0;

  const valorHora = salario / 240;
  const pagoHED = hed * valorHora * 1.25;
  const pagoHEN = hen * valorHora * 1.75;
    const pagoHENf = henf * valorHora * 2.5;
    const pagoHEDf = hedf * valorHora * 2;      


  const devengado = salarioBasico + subsidio + pagoHED + pagoHEN + pagoHENf + pagoHEDf;


const eps = (devengado - subsidio) * 0.04;
const pension = (devengado - subsidio) * 0.04;
const fondoSolid = (salario >= 4 * SMMLV) ? devengado * 0.01 : 0;

const totalDeducciones = eps + pension + fondoSolid;
const netoPagar = devengado - totalDeducciones;

document.getElementById('resultado').innerHTML = `
  Detalle de liquidación:<br>
  Salario básico: $${salarioBasico.toLocaleString('es-CO')}<br>
  Subsidio transporte: $${subsidio.toLocaleString('es-CO')}<br>
  Horas extras diurnas: $${pagoHED.toLocaleString('es-CO')}<br>
  Horas extras nocturnas: $${pagoHEN.toLocaleString('es-CO')}<br>
    Horas extras nocturnas festivas: $${pagoHENf.toLocaleString('es-CO')}<br>
    Horas extras diurnas festivas: $${pagoHEDf.toLocaleString('es-CO')}<br>
  Total devengado: $${devengado.toLocaleString('es-CO')}<br>
  EPS (4%): $${eps.toLocaleString('es-CO')}<br>
  Pensión (4%): $${pension.toLocaleString('es-CO')}<br>
  Fondo solidario (1%): $${fondoSolid.toLocaleString('es-CO')}<br><br>
  <strong>NETO A PAGAR: $${netoPagar.toLocaleString('es-CO')}</strong>
`;

}

  </script>
</body>
</html>
