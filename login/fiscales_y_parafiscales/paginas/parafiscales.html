<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Parafiscales</title>
</head>

<style>
  body {
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
     background: linear-gradient(
      135deg,
      #050505,
      #111111,
      #1a1a1a,
      #2a0000
    );
        margin:0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        min-height: 100vh;
    }

    .card{

        background: #2c2c2c;
        border-radius: 16px;
        padding: 30px 40px;
        animation: brilloContenedor 3s infinite ease-in-out;
        width:100%;
        max-width: 450px;
        margin: 30px 0;
        gap:20px;
    }
@keyframes brilloContenedor {
    0% {
        box-shadow: 0 0 10px #a20000;
    }
    50% {
        box-shadow: 0 0 25px #a20000, 0 0 40px #a20000;
    }
    100% {
        box-shadow: 0 0 10px #a20000;
    }
}
    h2{
        margin-bottom: 20px;
        color: #ffffff;
        text-align: center;
        font-weight: normal;
        text-shadow: 2px 2px 10px white
    }

    label{
        display:block;
        margin: 12px 0 6px;
        color: #ffffff;           
    }


    input{
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 1rem;
    }

    button {

    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: linear-gradient(
      135deg,
      #5c0000,
      #a20000,
      #ff2b2b
    );
    color: #fff;
    border:none;
    border-radius: 20px;
    font-size: 1rem;
    cursor: pointer;
      transition: transform 0.3s ease;

    }

    button:hover{
        background-color: #fff;
        color: #ffffff;
        transform: scale(1.1);
    }

    #resultado {
        margin-top: 20px;
        font-size: 1rem;
        color: #fff;
        white-space: pre-line;
    }
</style>

<body>
  <div class="card">
    <h2>Cálculo Parafiscales</h2>
    <label>Total Nómina (COP)</label>
    <input type="number" id="nomina" placeholder="Ej: 10000000">

    <button onclick="calcular()">Calcular</button>
    <div id="resultado"></div>
  </div>

  <script>
    function calcular() {
      const nomina = parseFloat(document.getElementById('nomina').value) || 0;

      const sena = nomina * 0.02;
      const icbf = nomina * 0.03;
      const cajaCompensacion = nomina * 0.04;

      document.getElementById('resultado').innerHTML = `
SENA (2%): $${sena.toLocaleString('es-CO')}
ICBF (3%): $${icbf.toLocaleString('es-CO')}
Caja de Compensación (4%): $${cajaCompensacion.toLocaleString('es-CO')}
Total Parafiscales: $${(sena + icbf + cajaCompensacion).toLocaleString('es-CO')}
      `;
    }
  </script>
</body>
</html>
